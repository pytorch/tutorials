name: Build tutorials

on:
  push:
    branches:
      - main
    # A fork PR gets no OIDC token to upload the preview, so a PR builds through
    # the ciflow/docs label, which pushes this tag from the base repo
    tags:
      - ciflow/docs/*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_build-tutorials-base.yml
    secrets: inherit
    with:
      USE_NIGHTLY: 0
      UPLOAD: 1
